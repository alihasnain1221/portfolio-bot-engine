    narrative: >
      Built and shipped a production 3-layer AI content moderation pipeline:
      AWS Rekognition hard gate -> OpenAI Moderation API (language-only) ->
      GPT-4o contextual judgment with a sports-domain system prompt and
      structured JSON output. Deliberately separated visual signals
      (pixel-level Rekognition labels) from language signals (AWS Transcribe +
      detected text) to eliminate false positives on sports content. Pipeline
      runs fully async for video via SNS/DynamoDB Streams and sync for images,
      feeding results via webhook to MongoDB. Re-architected the platform from
      monolithic MVP to microservices with full IaC on AWS. Also built MCP
      (Model Context Protocol) tools for the platform and implemented the AWS
      Lambda functions provisioned as code via Terraform.

