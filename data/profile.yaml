# =====================================================================
#  profile.yaml  --  hand-curated source of truth for the portfolio bot
# ---------------------------------------------------------------------
#  Edited by Ali. The ingestion merge step reads this and OVERRIDES git-
#  derived text for these projects:
#   - `narrative` is authoritative public summary text -> summary_public.
#   - `disclosure_tier` gates how much the bot may reveal.
#   - `repos` maps a featured project to the actual repo slug(s) on disk.
#   - `lead_focus` = the tech-lead / ownership areas the bot should surface
#     for that project (drawn from profile.tech_lead_areas; kept honest --
#     only areas Ali genuinely owned there).
#   - `ai_showcase: true` flags AI-heavy work to highlight prominently.
#   - featured order (rank) drives what the bot leads with.
#  Anything not listed here falls back to git-derived cards at 'summary'.
# =====================================================================

